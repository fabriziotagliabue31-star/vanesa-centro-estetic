<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel · Vanesa Centro Estetic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,450;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .svc-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .svc-row .svc-info{flex:1;min-width:180px;}
  .svc-row .svc-info b{display:block;font-size:14px;}
  .svc-row .svc-info span{font-size:12px;color:var(--ink-soft);}
  .svc-row input[type="number"]{width:110px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px;}
  .svc-row button{border:none;border-radius:8px;padding:8px 12px;font-size:13px;}
  .btn-save{background:var(--sage-dark);color:#fff;}
  .btn-delete{background:#F1E4D2;color:#8a5a1f;}
  .add-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;}
  .add-form input, .add-form select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px;}
  .add-form input[placeholder="Descripción"]{grid-column:1 / -1;}
  .add-form button{grid-column:1 / -1;background:var(--berry);color:#fff;border:none;border-radius:8px;padding:10px;font-size:14px;}
</style>
</head>
<body>

<div id="gate" class="wrap" style="padding-top:80px;max-width:360px;">
  <h1 style="font-size:22px;">Acceso al panel</h1>
  <p style="color:var(--ink-soft);font-size:14px;">Este link es privado. Si no sos Vanesa, cerrá esta página.</p>
</div>

<div id="admin" style="display:none;">
  <div class="wrap">
    <div class="admin-top">
      <h1>Panel · Vanesa Centro Estetic</h1>
      <div style="font-size:13px;color:var(--ink-soft);"><span class="live-dot"></span>En vivo</div>
    </div>

    <div class="kpis" id="kpis"></div>

    <section class="block">
      <h2>Facturación por mes</h2>
      <div class="chart" id="chart"></div>
    </section>

    <section class="block">
      <h2>Servicios y precios</h2>
      <div id="servicios-list"></div>
      <form class="add-form" id="add-form">
        <select id="new-category" required>
          <option value="">Categoría...</option>
          <option>Faciales</option>
          <option>Corporales</option>
          <option>T. Reductor</option>
          <option>Dermatología</option>
        </select>
        <input type="text" id="new-name" placeholder="Nombre del servicio" required>
        <input type="text" id="new-desc" placeholder="Descripción" required>
        <input type="number" id="new-price" placeholder="Precio" required min="0">
        <button type="submit">Agregar servicio</button>
      </form>
    </section>

    <section class="block">
      <h2>Agenda de turnos</h2>
      <table>
        <thead><tr><th>Fecha</th><th>Hora</th><th>Cliente</th><th>Servicio</th><th>Precio</th><th>Estado</th></tr></thead>
        <tbody id="agenda"></tbody>
      </table>
      <div id="agenda-empty" class="empty" style="display:none;">Todavía no hay turnos cargados.</div>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/catalog-data.js"></script>
<script>
// ⚠️ Cambiar esta clave y usarla solo en el link que le compartís a Vanesa:
// admin.html?key=TU-CLAVE
const ADMIN_KEY = "vanesa2026";

const params = new URLSearchParams(location.search);
if (params.get("key") !== ADMIN_KEY) {
  document.getElementById("gate").style.display = "block";
} else {
  document.getElementById("gate").style.display = "none";
  document.getElementById("admin").style.display = "block";
  init();
}

function monthKey(dateStr){
  const d = new Date(dateStr);
  return d.toLocaleDateString("es-AR", {month:"short", year:"2-digit"});
}

/* ---------------- TURNOS ---------------- */
async function loadTurnos(){
  const { data, error } = await supabaseClient.from("turnos").select("*").order("date").order("time");
  if(error){ console.error(error); return []; }
  return data;
}

async function updateStatus(id, newStatus){
  await supabaseClient.from("turnos").update({ status: newStatus }).eq("id", id);
}

async function renderTurnos(){
  const list = await loadTurnos();

  const total = list.reduce((sum,t)=> sum + t.price, 0);
  const now = new Date();
  const thisMonth = list.filter(t=>{
    const d = new Date(t.date);
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  });
  const countByService = {};
  list.forEach(t=> countByService[t.service] = (countByService[t.service]||0) + 1);
  const top = Object.entries(countByService).sort((a,b)=>b[1]-a[1])[0];

  document.getElementById("kpis").innerHTML = `
    <div class="kpi"><div class="label">Facturación total (estimada)</div><div class="value">${money(total)}</div></div>
    <div class="kpi"><div class="label">Turnos totales</div><div class="value">${list.length}</div></div>
    <div class="kpi"><div class="label">Turnos este mes</div><div class="value">${thisMonth.length}</div></div>
    <div class="kpi"><div class="label">Servicio más pedido</div><div class="value" style="font-size:16px;">${top ? top[0] : "—"}</div></div>
  `;

  const byMonth = {};
  list.forEach(t=>{
    const k = monthKey(t.date);
    byMonth[k] = (byMonth[k]||0) + t.price;
  });
  const months = Object.keys(byMonth);
  const max = Math.max(1, ...Object.values(byMonth));
  const chart = document.getElementById("chart");
  chart.innerHTML = months.length ? months.map(m=>`
    <div class="bar-col">
      <div class="m-value">${money(byMonth[m])}</div>
      <div class="bar" style="height:${(byMonth[m]/max*100)}%;"></div>
      <div class="m-label">${m}</div>
    </div>`).join("") : `<div class="empty">Todavía no hay datos para mostrar.</div>`;

  const agenda = document.getElementById("agenda");
  const emptyMsg = document.getElementById("agenda-empty");
  if(!list.length){
    agenda.innerHTML = "";
    emptyMsg.style.display = "block";
  } else {
    emptyMsg.style.display = "none";
    agenda.innerHTML = list.map(t=>`
      <tr>
        <td>${t.date}</td>
        <td>${t.time}</td>
        <td>${t.name}</td>
        <td>${t.service}</td>
        <td>${money(t.price)}</td>
        <td><button class="status-pill status-${t.status}" data-id="${t.id}">${t.status}</button></td>
      </tr>`).join("");
    agenda.querySelectorAll("button[data-id]").forEach(btn=>{
      btn.onclick = async ()=>{
        const current = list.find(x=>x.id == btn.dataset.id);
        const next = current.status === "pendiente" ? "confirmado" : "pendiente";
        await updateStatus(current.id, next);
      };
    });
  }
}

/* ---------------- SERVICIOS ---------------- */
async function loadServicios(){
  const { data, error } = await supabaseClient
    .from("servicios")
    .select("*")
    .order("category")
    .order("sort_order");
  if(error){ console.error(error); return []; }
  return data;
}

async function renderServicios(){
  const list = await loadServicios();
  const wrap = document.getElementById("servicios-list");

  if(!list.length){
    wrap.innerHTML = `<p class="empty">No hay servicios cargados todavía.</p>`;
    return;
  }

  wrap.innerHTML = list.map(s => `
    <div class="svc-row" data-id="${s.id}">
      <div class="svc-info">
        <b>${s.name}</b>
        <span>${s.category} · ${s.description}</span>
      </div>
      <input type="number" class="svc-price" value="${s.price}" min="0">
      <button class="btn-save">Guardar</button>
      <button class="btn-delete">Eliminar</button>
    </div>
  `).join("");

  wrap.querySelectorAll(".svc-row").forEach(row=>{
    const id = row.dataset.id;
    row.querySelector(".btn-save").onclick = async ()=>{
      const newPrice = Number(row.querySelector(".svc-price").value);
      await supabaseClient.from("servicios").update({ price: newPrice }).eq("id", id);
      row.querySelector(".btn-save").textContent = "Guardado ✓";
      setTimeout(()=> row.querySelector(".btn-save").textContent = "Guardar", 1500);
    };
    row.querySelector(".btn-delete").onclick = async ()=>{
      if(!confirm("¿Eliminar este servicio del catálogo?")) return;
      await supabaseClient.from("servicios").delete().eq("id", id);
      renderServicios();
    };
  });
}

document.getElementById("add-form").onsubmit = async (e)=>{
  e.preventDefault();
  const category = document.getElementById("new-category").value;
  const name = document.getElementById("new-name").value.trim();
  const description = document.getElementById("new-desc").value.trim();
  const price = Number(document.getElementById("new-price").value);
  if(!category || !name || !description || !price) return;

  await supabaseClient.from("servicios").insert({ category, name, description, price, sort_order: 99 });
  e.target.reset();
  renderServicios();
};

/* ---------------- INIT + REALTIME ---------------- */
function init(){
  renderTurnos();
  renderServicios();

  supabaseClient
    .channel("turnos-realtime")
    .on("postgres_changes", { event: "*", schema: "public", table: "turnos" }, renderTurnos)
    .subscribe();

  supabaseClient
    .channel("servicios-realtime")
    .on("postgres_changes", { event: "*", schema: "public", table: "servicios" }, renderServicios)
    .subscribe();
}
</script>
</body>
</html>
